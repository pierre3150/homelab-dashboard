# A copier dans /etc/fail2ban/filter.d/homelab-dashboard.conf
#
# Matche les lignes FAILED_LOGIN et BOT_BLOCKED ecrites par LoginAuditService
# dans le fichier de log dedie (voir docker-compose.yml pour le montage du
# volume qui rend ce fichier lisible depuis l'hote).
#
# Exemple de ligne matchee:
# FAILED_LOGIN ip=203.0.113.42 user=admin stage=Password os="Windows 10" browser="Chrome 120" time=2026-09-10T14:32:01.000Z

[Definition]
failregex = ^(FAILED_LOGIN|BOT_BLOCKED) ip=<HOST> user=.*$
ignoreregex =
