# A copier dans /etc/nginx/snippets/proxy-common.conf
#
# X-Forwarded-For et X-Forwarded-Proto sont CRITIQUES: sans eux, l'app ne voit
# jamais la vraie IP du client (fail2ban et le journal de connexions se
# tromperaient sur qui se connecte), et le cookie de session ne se posera
# jamais (CookieSecurePolicy.Always exige que l'app sache que la requete est
# bien passee en HTTPS, ce qu'elle ne peut deduire que via X-Forwarded-Proto).

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_http_version 1.1;
proxy_set_header Connection "";
