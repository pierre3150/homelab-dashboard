# Reverse proxy pour homelab-dashboard.
# A copier dans /etc/nginx/sites-available/ sur l'hote (pas dans le conteneur),
# puis: ln -s vers sites-enabled, nginx -t, systemctl reload nginx.
#
# Remplace DOMAINE.exemple.fr par ton vrai domaine avant de deployer.
# Certificat TLS via certbot: certbot --nginx -d DOMAINE.exemple.fr

# Limite de debit au niveau nginx, en plus du rate limiter applicatif et de
# fail2ban - defense en profondeur. 5 requetes/min sur la zone "login".
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name DOMAINE.exemple.fr;

    # Redirection HTTPS - certbot ajoutera generalement ce bloc automatiquement
    # s'il ne l'a pas deja fait.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name DOMAINE.exemple.fr;

    # certbot remplit ces deux lignes automatiquement (certbot --nginx)
    ssl_certificate     /etc/letsencrypt/live/DOMAINE.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAINE.exemple.fr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # En-tetes de securite basiques
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Route de login: rate-limitee au niveau nginx en plus du reste.
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8088;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
