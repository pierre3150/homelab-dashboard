name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write
  packages: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        id: run_tests
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Report failing tests as annotations
        if: failure() && steps.run_tests.outcome == 'failure'
        run: |
          python3 - <<'PYEOF'
          import glob, xml.etree.ElementTree as ET

          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for f in glob.glob('**/test-results.trx', recursive=True):
              tree = ET.parse(f)
              for r in tree.getroot().findall('.//t:UnitTestResult', ns):
                  if r.get('outcome') == 'Failed':
                      msg_el = r.find('.//t:Message', ns)
                      msg = (msg_el.text or '').replace('\n', ' ').replace('%', '%25') if msg_el is not None else ''
                      print(f"::error::FAILED TEST: {r.get('testName')} | {msg}")
          PYEOF

  publish-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/homelab-dashboard:latest
            ghcr.io/${{ github.repository_owner }}/homelab-dashboard:${{ github.sha }}
