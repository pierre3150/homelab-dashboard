version: "3.8"

services:
  homelab-dashboard:
    image: ghcr.io/pierre3150/homelab-dashboard:latest
    container_name: homelab-dashboard
    restart: unless-stopped
    ports:
      # NPM tourne dans un AUTRE conteneur (pas sur cet hote), donc contrairement
      # a un nginx local, il ne peut pas atteindre 127.0.0.1 ici - il faut que le
      # port soit joignable depuis le LAN. Ce n'est pas une porte ouverte sur
      # internet pour autant : rien ne route vers ce CT depuis l'exterieur, seul
      # NPM (sur le LAN) le fait, et TrustedProxy__SharedSecret plus bas empeche
      # quiconque d'usurper l'entete Authelia meme s'il atteint ce port en direct.
      - "8088:8080"
    volumes:
      # Base SQLite (utilisateurs, historique de connexions) - persiste entre
      # les redeploiements.
      - ./data/db:/data
      # Trousseau de chiffrement des secrets TOTP - NE JAMAIS perdre ce dossier
      # sans perdre aussi la 2FA de tous les comptes.
      - ./data/keys:/data/keys
      # Journal d'audit des connexions, monte en lecture pour fail2ban qui
      # tourne sur l'hote (voir deploy/fail2ban/).
      - ./logs:/data/logs
      # Cle privee SSH dediee a la console web (jamais la clé perso).
      # Le fichier doit exister sur l'hote AVANT le premier `docker compose up`.
      - ./ssh/dashboard_console_key:/data/ssh/dashboard_console_key:ro
    environment:
      # Compte admin cree automatiquement au premier demarrage si aucun
      # utilisateur n'existe encore. Change le mot de passe ensuite si besoin
      # (pas d'UI de creation de compte pour l'instant - dashboard personnel).
      ADMIN_USERNAME: "pierre"
      ADMIN_PASSWORD: "change-moi-avant-le-premier-demarrage"

      # Decommente UNIQUEMENT pour tester en local en http:// sans nginx/TLS
      # devant. Le cookie de session est Secure (HTTPS-only) par defaut - sans
      # cette ligne, la connexion a l'air de marcher (200 OK) mais le cookie
      # n'est jamais pose et tu resteras deconnecte a la requete suivante.
      # NE JAMAIS laisser cette ligne active sur un deploiement expose en ligne.
      # DASHBOARD_ALLOW_INSECURE_COOKIE: "true"

      # Identifiants de l'API Proxmox VE (Datacenter -> Permissions -> API Tokens).
      # Ne jamais utiliser le mot de passe root ici : un token API se scope et se révoque.
      PROXMOX__HOST: "192.168.1.X"
      PROXMOX__TOKENID: "root@pam!dashboard"
      PROXMOX__TOKENSECRET: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

      # Optionnel: cle secrete hCaptcha (https://www.hcaptcha.com/, gratuit).
      # Laisse vide pour desactiver le captcha (le honeypot + rate limiting +
      # fail2ban restent actifs sans lui).
      CAPTCHA__HCAPTCHASECRETKEY: ""

      # Console SSH web: utilisateur cree sur chaque CT (voir README), et la
      # correspondance VMID -> IP. Complete/ajuste avec tes vrais CT.
      SSH__USERNAME: "dashboard"
      SSH__PRIVATEKEYPATH: "/data/ssh/dashboard_console_key"
      SSH_HOSTS_MAP: '{"100":"192.168.1.71","101":"192.168.1.72","102":"192.168.1.73","104":"192.168.1.77","106":"192.168.1.84","107":"192.168.1.40"}'

      # Optionnel - SSO via Authelia: une fois defini, une requete qui arrive
      # avec le bon secret partage (entete X-Trusted-Proxy-Secret, injectee
      # uniquement par le snippet Advanced du Proxy Host NPM - voir README)
      # ET un entete Remote-User (pose par Authelia) est connectee
      # automatiquement, sans repasser par le login/TOTP interne. Sans le bon
      # secret, ou en acces direct IP:port sans passer par NPM, le login
      # interne classique reste actif - c'est le filet de securite.
      #
      # Genere une valeur forte avec: openssl rand -hex 32
      # Laisse vide/absent pour desactiver completement cette fonctionnalite.
      TRUSTEDPROXY__SHAREDSECRET: ""
